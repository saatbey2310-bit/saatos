<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 Web Payload Loader & Fetcher</title>
    <style>
        body {
            background-color: #07090f;
            color: #00ffcc;
            font-family: monospace;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .terminal-box {
            border: 2px solid #00ffcc;
            background: #0d121f;
            padding: 25px;
            border-radius: 14px;
            width: 85%;
            max-width: 650px;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.25);
        }
        h1 {
            color: #ff0055;
            font-size: 20px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p {
            color: #8ab4f8;
            font-size: 13px;
            margin-bottom: 15px;
        }
        .controls {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
        }
        select, button {
            background: #04060a;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 8px 12px;
            font-family: monospace;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #00ffcc;
            color: #04060a;
            font-weight: bold;
        }
        pre {
            text-align: left;
            color: #33ff99;
            background: #04060a;
            padding: 12px;
            border-radius: 8px;
            height: 200px;
            overflow-y: auto;
            border: 1px dashed #224;
            font-size: 12px;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="terminal-box">
        <h1>[ PS4 PAYLOAD LOADER ]</h1>
        <p>Repo Dosyalarını Seç ve .Bin Olarak Belleğe Çek</p>
        
        <div class="controls">
            <label for="payloadSelect">Payload Seç:</label>
            <select id="payloadSelect">
                <!-- Repona attığın .bin veya .js dosyalarının isimlerini buraya ekleyebilirsin -->
                <option value="stage1.bin">stage1.bin</option>
                <option value="stage2.bin">stage2.bin</option>
                <option value="netcat.bin">netcat.bin</option>
            </select>
            <button onclick="fetchAndLoadBin()">Payload'ı Çek ve Yükle</button>
        </div>

        <pre id="log">[*] Sistem hazır. Listeden payload seçip yükle butonuna basın...\n</pre>
    </div>

    <script>
        function printLog(msg) {
            const logBox = document.getElementById('log');
            logBox.innerText += msg + "\n";
            logBox.scrollTop = logBox.scrollHeight;
        }

        async function fetchAndLoadBin() {
            const selectBox = document.getElementById('payloadSelect');
            const fileName = selectBox.value;

            // GitHub repo bilgilerin
            const username = "saatbey2310-bit";
            const repo = "saatos";
            const branch = "main";
            
            const rawUrl = `https://raw.githubusercontent.com/${username}/${repo}/${branch}/${fileName}`;

            printLog("\n[*] Talep ediliyor: " + fileName);
            printLog("[*] Kaynak: " + rawUrl);

            try {
                // Dosyayı ham binary veri (.bin gibi) olarak çekiyoruz
                const response = await fetch(rawUrl);
                if (!response.ok) {
                    throw new Error(`HTTP Hata: ${response.status} (Dosya repoda bulunamadı!)`);
                }

                const buffer = await response.arrayBuffer();
                printLog("[+] Dosya başarıyla indirildi!");
                printLog("[+] Boyut: " + buffer.byteLength + " bayt.");

                // PS4 tarayıcı belleğine (Heap / TypedArray) map etme simülasyonu
                let payloadView = new Uint8Array(buffer);
                
                // İlk 16 baytlık Hex önizlemesi
                let hexPreview = Array.from(payloadView.slice(0, 16))
                    .map(b => '0x' + b.toString(16).padStart(2, '0'))
                    .join(' ');
                
                printLog("[*] Bellek Adresi (Simüle): 0x90c00000");
                printLog("[*] İlk 16 Bayt (Hex): " + hexPreview);
                printLog("[+] Durum: Payload yürütmeye hazır!");

            } catch (err) {
                printLog("[-] Hata: " + err.message);
                printLog("[!] İpucu: Reponda seçtiğin isimde bir dosya olduğundan emin ol.");
            }
        }
    </script>

</body>
</html>
