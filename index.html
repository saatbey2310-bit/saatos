<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binary & JS Payload Loader</title>
    <style>
        body {
            background-color: #07090f;
            color: #00ffcc;
            font-family: monospace;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .terminal-box {
            border: 2px solid #00ffcc;
            background: #0d121f;
            padding: 25px;
            border-radius: 14px;
            width: 85%;
            max-width: 650px;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.25);
        }
        h1 {
            color: #ff0055;
            font-size: 20px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p {
            color: #8ab4f8;
            font-size: 13px;
            margin-bottom: 15px;
        }
        .controls {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }
        .row {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        select, input[type="file"], button {
            background: #04060a;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 8px 12px;
            font-family: monospace;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #00ffcc;
            color: #04060a;
            font-weight: bold;
        }
        pre {
            text-align: left;
            color: #33ff99;
            background: #04060a;
            padding: 12px;
            border-radius: 8px;
            height: 180px;
            overflow-y: auto;
            border: 1px dashed #224;
            font-size: 12px;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="terminal-box">
        <h1>[ BIN & JS PAYLOAD LOADER ]</h1>
        <p>Yerel Dosya Okuyucu ve Bellek Enjeksiyon Paneli</p>
        
        <div class="controls">
            <div class="row">
                <label for="payloadSelect">Hazır Seçenek:</label>
                <select id="payloadSelect">
                    <option value="stage1">Stage 1 (Simüle Edilmiş Baytlar)</option>
                    <option value="stage2">Stage 2 (Kernel Yükü)</option>
                </select>
                <button onclick="loadPreset()">Çalıştır</button>
            </div>
            
            <div class="row">
                <label for="fileInput">Özel .bin / .js Seç:</label>
                <input type="file" id="fileInput" accept=".bin,.js">
                <button onclick="loadLocalFile()">Dosyayı Oku</button>
            </div>
        </div>

        <pre id="log">[*] Sistem hazır. Dosya seçin veya hazır paketlerden birini çalıştırın...\n</pre>
    </div>

    <script>
        function printLog(msg) {
            const logBox = document.getElementById('log');
            logBox.innerText += msg + "\n";
            logBox.scrollTop = logBox.scrollHeight;
        }

        function loadPreset() {
            const selected = document.getElementById('payloadSelect').value;
            printLog("\n[*] Seçilen hazır paket okunuyor: " + selected.toUpperCase());
            
            setTimeout(() => {
                if (selected === "stage1") {
                    printLog("[+] Stage 1 başarıyla yüklendi. Boyut: 499 bayt.");
                } else {
                    printLog("[+] Stage 2 başarıyla yüklendi. Boyut: 356 bayt.");
                }
            }, 400);
        }

        function loadLocalFile() {
            const fileInput = document.getElementById('fileInput');
            if (fileInput.files.length === 0) {
                printLog("[-] Hata: Lütfen önce bir dosya seçin!");
                return;
            }

            const file = fileInput.files[0];
            printLog("\n[*] Dosya okunuyor: " + file.name);

            const reader = new FileReader();
            reader.onload = function(e) {
                const buffer = e.target.result;
                printLog("[+] Dosya başarıyla belleğe aktarıldı!");
                printLog("[+] Dosya Boyutu: " + buffer.byteLength + " bayt.");
                
                // İstersen ArrayBuffer üzerinden bayt analizi simülasyonu
                let view = new Uint8Array(buffer);
                printLog("[*] İlk 4 bayt (Hex): " + 
                    Array.from(view.slice(0, 4)).map(b => '0x' + b.toString(16).padStart(2, '0')).join(' ')
                );
            };

            reader.onerror = function() {
                printLog("[-] Dosya okuma hatası!");
            };

            // Dosyayı ham binary veri (ArrayBuffer) olarak okuyoruz
            reader.readAsArrayBuffer(file);
        }
    </script>

</body>
</html>
