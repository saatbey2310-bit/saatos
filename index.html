<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Payload Loader & Exploit Host</title>
    <style>
        body {
            background-color: #07090f;
            color: #00ffcc;
            font-family: monospace;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .terminal-box {
            border: 2px solid #00ffcc;
            background: #0d121f;
            padding: 25px;
            border-radius: 14px;
            width: 85%;
            max-width: 600px;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.25);
        }
        h1 {
            color: #ff0055;
            font-size: 22px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p {
            color: #8ab4f8;
            font-size: 13px;
            margin-bottom: 15px;
        }
        .menu {
            margin-bottom: 15px;
        }
        select, button {
            background: #04060a;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 8px 12px;
            font-family: monospace;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #00ffcc;
            color: #04060a;
            font-weight: bold;
        }
        pre {
            text-align: left;
            color: #33ff99;
            background: #04060a;
            padding: 12px;
            border-radius: 8px;
            height: 180px;
            overflow-y: auto;
            border: 1px dashed #224;
            font-size: 12px;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="terminal-box">
        <h1>[ WEB PAYLOAD LOADER ]</h1>
        <p>Hedef Payload Seçim Paneli</p>
        
        <div class="menu">
            <label for="payloadSelect">Payload Seç: </label>
            <select id="payloadSelect">
                <option value="stage1">Stage 1 (LCP Parser Init)</option>
                <option value="stage2">Stage 2 (Kernel Exploit Payload)</option>
                <option value="stress">WebKit Heap Stress Test</option>
            </select>
            <button onclick="loadSelectedPayload()">Yükle ve Çalıştır</button>
        </div>

        <pre id="log">[*] Sistem hazır. Lütfen bir payload seçin ve yükle butonuna basın...\n</pre>
    </div>

    <script>
        function printLog(msg) {
            const logBox = document.getElementById('log');
            logBox.innerText += msg + "\n";
            logBox.scrollTop = logBox.scrollHeight;
        }

        function loadSelectedPayload() {
            const selected = document.getElementById('payloadSelect').value;
            printLog("\n[*] Seçilen payload tetikleniyor: " + selected.toUpperCase());

            setTimeout(() => {
                try {
                    if (selected === "stage1") {
                        printLog("[*] Stage 1 baytları okunuyor...");
                        printLog("[+] Stage 1 başarıyla belleğe map edildi. (Boyut: ~500 bayt)");
                        printLog("[!] Sonraki aşama için Stage 2 bekleniyor...");
                    } 
                    else if (selected === "stage2") {
                        printLog("[*] Stage 2 kernel yükü hazırlanıyor...");
                        printLog("[*] Bellek ofsetleri taranıyor...");
                        printLog("[+] Stage 2 bellek havuzuna yerleştirildi. Tetikleyiciye hazır!");
                    } 
                    else if (selected === "stress") {
                        printLog("[*] WebKit motoru Heap Spraying testi başlatılıyor...");
                        let memoryHeap = [];
                        for (let i = 0; i < 50; i++) {
                            memoryHeap.push(new ArrayBuffer(1024 * 1024 * 2)); // 2MB
                        }
                        printLog("[+] Bellek testi başarıyla tamamlandı. Kararlılık stabil.");
                    }
                } catch (err) {
                    printLog("[-] Hata oluştu: " + err.message);
                }
            }, 500);
        }
    </script>

</body>
</html>
