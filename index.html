<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Custom SlopKit Loader 💀</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #00ffcc;
            font-family: monospace;
            padding: 40px;
        }
        h1 { color: #ff5555; }
        #console-log {
            background: #111625;
            border: 1px solid #1f293d;
            padding: 20px;
            border-radius: 6px;
            height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h1>Custom Userland Test Ortamı 🚀</h1>
    <p>Vanguard yine çıldırmış gibi bellek adreslerini bekliyoruz...</p>
    <div id="console-log"></div>

    <script>
        function logToScreen(message) {
            const logDiv = document.getElementById('console-log');
            logDiv.innerHTML += `> ${message}\n`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        window.onload = function() {
            logToScreen("WebKit ortamı başlatıldı.");
            logToScreen("Offsets dosyası kontrol ediliyor...");
            
            // Buraya kendi exploit tetikleme veya offset yükleme JS kodlarını ekleyebilirsin
            setTimeout(() => {
                logToScreen("⚠️ Uyarı: Bellek sınırları zorlanıyor...");
            }, 1500);
        };
    </script>
</body>
</html>
