<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>WebKit Stress Test & Heap Spraying</title>
    <style>
        body {
            background-color: #05050a;
            color: #00ffcc;
            font-family: monospace;
            text-align: center;
            margin-top: 15vh;
        }
        h1 { color: #ff0055; font-size: 28px; }
        .terminal {
            border: 2px solid #00ffcc;
            background: #0b0f19;
            padding: 25px;
            display: inline-block;
            border-radius: 12px;
            width: 80%;
            max-width: 600px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
        }
        pre {
            text-align: left;
            color: #33ff99;
            font-size: 14px;
            height: 150px;
            overflow: hidden;
            border-top: 1px dashed #333;
            margin-top: 15px;
            padding-top: 10px;
        }
    </style>
</head>
<body>
    <div class="terminal">
        <h1>[ WEBKIT STRESS TEST ]</h1>
        <p>Bellek doldurma ve nesne tahsis döngüsü başlatılıyor...</p>
        <pre id="log">[*] Hazırlanıyor...\n</pre>
    </div>

    <script>
        function logMessage(msg) {
            const logBox = document.getElementById('log');
            logBox.innerText += msg + "\n";
            logBox.scrollTop = logBox.scrollHeight;
        }

        window.addEventListener('load', function() {
            setTimeout(() => {
                logMessage("[*] JavaScript motoru hazırlanıyor...");
                
                try {
                    // Heap Spraying Simülasyonu (Belleği doldurma deneyi)
                    let memoryHeap = [];
                    logMessage("[*] Büyük nesne dizileri (ArrayBuffers) oluşturuluyor...");
                    
                    for (let i = 0; i < 50; i++) {
                        // Her adımda bellek yığınını şişiriyoruz
                        let buffer = new ArrayBuffer(1024 * 1024 * 4); // 4MB'lık bloklar
                        memoryHeap.push(buffer);
                    }
                    
                    logMessage("[+] Bellek havuzu başarıyla dolduruldu!");
                    logMessage("[!] WebKit karar mekanizması zorlanıyor...");

                    setTimeout(() => {
                        logMessage("[*] Sahte UAF tetikleme döngüsü deneniyor...");
                        // Tarayıcının bellek sınırlarını zorlayan tip dönüşümleri
                        for(let j = 0; j < 100000; j++) {
                            let dummy = { a: 1, b: 2 };
                            JSON.parse(JSON.stringify(dummy));
                        }
                        logMessage("[!] Test tamamlandı. Tarayıcı çökmediyse bellek güvenli!");
                    }, 1500);

                } catch (err) {
                    logMessage("[-] Bellek Hatası (Out of Memory): " + err.message);
                    logMessage("[!] Tarayıcı koruması başarıyla devreye girdi.");
                }
            }, 1000);
        });
    </script>
</body>
</html>
