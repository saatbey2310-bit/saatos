<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Binary Payload Loader</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="terminal-box">
        <h1>[ REAL .BIN LOADER ]</h1>
        <p>Ham Binary Dosya Çekme & Bellek Enjeksiyonu</p>
        
        <div class="controls">
            <input type="text" id="binName" placeholder="payload.bin" value="payload.bin">
            <button onclick="loadRealBinary()">Dosyayı Ham Çek</button>
        </div>

        <pre id="log">[*] Sistem hazır. Gerçek .bin dosyasını çekmek için tıkla...\n</pre>
    </div>

    <!-- Mantığı yürütecek harici JavaScript dosyası -->
    <script src="loader.js"></script>
</body>
</html>
