<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Repo Dosya Okuyucu</title>
    <style>
        body {
            background-color: #07090f;
            color: #00ffcc;
            font-family: monospace;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .terminal-box {
            border: 2px solid #00ffcc;
            background: #0d121f;
            padding: 25px;
            border-radius: 14px;
            width: 85%;
            max-width: 650px;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.25);
        }
        h1 {
            color: #ff0055;
            font-size: 20px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p {
            color: #8ab4f8;
            font-size: 13px;
            margin-bottom: 15px;
        }
        .controls {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        input[type="text"], button {
            background: #04060a;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 8px 12px;
            font-family: monospace;
            border-radius: 5px;
        }
        input[type="text"] {
            width: 60%;
        }
        button:hover {
            background: #00ffcc;
            color: #04060a;
            font-weight: bold;
            cursor: pointer;
        }
        pre {
            text-align: left;
            color: #33ff99;
            background: #04060a;
            padding: 12px;
            border-radius: 8px;
            height: 200px;
            overflow-y: auto;
            border: 1px dashed #224;
            font-size: 12px;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="terminal-box">
        <h1>[ GITHUB REPO READER ]</h1>
        <p>Repodaki Dosyayı Doğrudan Çek ve Oku</p>
        
        <div class="controls">
            <input type="text" id="filePath" placeholder="örn: payload.js veya test.bin" value="payload.js">
            <button onclick="fetchRepoFile()">Dosyayı Oku</button>
        </div>

        <pre id="log">[*] Sistem hazır. Okumak istediğin dosya adını yaz ve butona bas...\n</pre>
    </div>

    <script>
        function printLog(msg) {
            const logBox = document.getElementById('log');
            logBox.innerText += msg + "\n";
            logBox.scrollTop = logBox.scrollHeight;
        }

        async function fetchRepoFile() {
            const fileName = document.getElementById('filePath').value.trim();
            if (!fileName) {
                printLog("[-] Hata: Lütfen bir dosya adı girin!");
                return;
            }

            // Kendi GitHub kullanıcı adını ve repo adını buraya yazıyorsun
            // Örnek: https://raw.githubusercontent.com/kullaniciadin/repoadin/main/dosyaadi
            const username = "saatbey2310-bit"; // Ekran görüntüsündeki kullanıcı adından alındı
            const repo = "saatos"; // Ekran görüntüsündeki repo adından alındı
            const branch = "main";
            
            const rawUrl = `https://raw.githubusercontent.com/${username}/${repo}/${branch}/${fileName}`;

            printLog("\n[*] Dosya talep ediliyor: " + fileName);
            printLog("[*] URL: " + rawUrl);

            try {
                const response = await fetch(rawUrl);
                if (!response.ok) {
                    throw new Error(`HTTP Hata Kodu: ${response.status} (Dosya bulunamadı!)`);
                }

                const contentType = response.headers.get("content-type");
                
                // Eğer metin tabanlı bir dosyaysa (.js, .txt, .html)
                if (contentType && contentType.includes("text")) {
                    const textData = await response.text();
                    printLog("[+] Dosya başarıyla okundu (Metin):");
                    printLog("----------------------------------------");
                    printLog(textData);
                } else {
                    // Eğer binary (.bin) bir dosyaysa
                    const buffer = await response.arrayBuffer();
                    printLog("[+] Dosya başarıyla okundu (Binary):");
                    printLog("[+] Boyut: " + buffer.byteLength + " bayt.");
                    
                    let view = new Uint8Array(buffer);
                    let hexPreview = Array.from(view.slice(0, 16)).map(b => '0x' + b.toString(16).padStart(2, '0')).join(' ');
                    printLog("[*] İlk 16 bayt (Hex): " + hexPreview);
                }

            } catch (err) {
                printLog("[-] Hata: " + err.message);
            }
        }
    </script>

</body>
</html>
